[package]
name = "pi-web-backend"
description = "HTTP and SSE host for the YLL coding agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/standalone.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
axum = { workspace = true, features = ["multipart"] }
futures.workspace = true
pi-coding-agent = { path = "../pi-coding-agent" }
pi-codemode = { path = "../pi-codemode" }
pi-mcp = { path = "../pi-mcp" }
pi-ai.workspace = true
pi-agent.workspace = true
pi-tui = { path = "../pi-tui" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10.0"
reqwest.workspace = true
ring.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
url = "2.5.8"
portable-pty = "0.9"
p256 = { version = "0.14", features = ["ecdsa"] }
libc = "0.2"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "allow"


